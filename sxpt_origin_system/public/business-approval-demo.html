<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>采购审批 - 脚本接入示例</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; color: #1f2937; background: #f3f6fa; font-family: Inter, "Microsoft YaHei", "PingFang SC", Arial, sans-serif; }
      .business-shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100vh; }
      .business-nav { border-right: 1px solid #d8e1ec; background: #1f2937; color: #dbe7f4; padding: 24px 18px; }
      .business-nav strong { display: block; color: white; font-size: 18px; margin-bottom: 24px; }
      .business-nav span { display: block; padding: 11px 12px; border-radius: 6px; }
      .business-nav span.active { background: #334155; }
      main { padding: 24px; }
      .toolbar, .approval-card, .summary { background: white; border: 1px solid #dbe4ef; border-radius: 8px; box-shadow: 0 12px 28px rgba(15, 23, 42, 0.05); }
      .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 18px; margin-bottom: 18px; }
      h1, h2, p { margin-top: 0; }
      h1 { margin-bottom: 8px; font-size: 24px; }
      .content-grid { display: grid; grid-template-columns: minmax(420px, 1fr) 300px; gap: 18px; }
      .approval-card, .summary { padding: 22px; }
      label { display: grid; gap: 7px; margin-bottom: 16px; color: #475569; font-size: 13px; }
      textarea, select { width: 100%; border: 1px solid #cbd5e1; border-radius: 6px; padding: 10px; font: inherit; }
      textarea { min-height: 120px; resize: vertical; }
      textarea:focus, select:focus { outline: none; border-color: #0f766e; box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.14); }
      .actions { display: flex; justify-content: flex-end; gap: 12px; }
      button, a { display: inline-flex; min-height: 40px; align-items: center; justify-content: center; border: 0; border-radius: 6px; padding: 0 16px; background: #0f766e; color: white; font: inherit; font-weight: 700; cursor: pointer; text-decoration: none; }
      .secondary { background: #334155; }
      .status { display: inline-flex; height: 28px; align-items: center; padding: 0 10px; border-radius: 999px; background: #fef3c7; color: #92400e; font-weight: 700; }
      .meta { display: grid; gap: 10px; margin-top: 18px; color: #64748b; }
      .meta strong { color: #1f2937; }
      @media (max-width: 700px) {
        .business-shell { grid-template-columns: 1fr; }
        .business-nav { display: none; }
        main { padding: 116px 12px 72px; }
        .toolbar { align-items: flex-start; flex-direction: column; padding: 14px; }
        h1 { font-size: 21px; }
        .content-grid { grid-template-columns: 1fr; }
        .approval-card, .summary { padding: 14px; }
        .actions { flex-wrap: wrap; }
      }
    </style>
  </head>
  <body>
    <div class="business-shell">
      <aside class="business-nav">
        <strong>采购系统</strong>
        <span>采购申请</span>
        <span class="active">审批中心</span>
        <span>供应商管理</span>
        <span>统计报表</span>
      </aside>
      <main>
        <section class="toolbar">
          <div>
            <h1>采购审批</h1>
            <p>业务已进入审批角色页面，SDK 会在页面切换后继续备案。</p>
          </div>
          <a class="secondary" data-action="back-application" data-label="返回采购申请" href="/business-sdk-demo.html">返回申请</a>
        </section>
        <section class="content-grid">
          <section class="approval-card">
            <h2>审批意见</h2>
            <label>
              审批结论
              <select data-action="approval-result" data-label="审批结论">
                <option value="PASS">同意</option>
                <option value="RETURN">退回修改</option>
              </select>
            </label>
            <label>
              审批意见
              <textarea data-action="approval-comment" data-label="审批意见"></textarea>
            </label>
            <div class="actions">
              <button class="secondary" type="button" data-action="save-approval">暂存</button>
              <button type="button" data-action="approve-submit">确认审批</button>
            </div>
          </section>
          <aside class="summary" data-action="approval-summary" data-label="申请摘要">
            <span class="status">待审批</span>
            <h2>采购-2026-0001</h2>
            <div class="meta">
              <span>申请人：<strong>张老师</strong></span>
              <span>采购金额：<strong>12,800 元</strong></span>
              <span>当前角色：<strong>财务审批人</strong></span>
            </div>
          </aside>
        </section>
      </main>
    </div>
    <script
      src="/training-recorder.js"
      data-teaching-parent-origin="*"
      data-teaching-allowed-parent-origins="*"
    ></script>
  </body>
</html>
