<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>采购申请业务系统</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: #1f2937;
        background: #eef2f7;
        font-family:
          Inter,
          "Microsoft YaHei",
          "PingFang SC",
          Arial,
          sans-serif;
      }

      .business-shell {
        display: grid;
        grid-template-columns: 220px 1fr;
        min-height: 100vh;
      }

      .business-nav {
        background: #203044;
        color: #d7e2ef;
        padding: 24px 18px;
      }

      .business-nav strong {
        display: block;
        color: white;
        font-size: 18px;
        margin-bottom: 24px;
      }

      .business-nav span {
        display: block;
        padding: 11px 12px;
        border-radius: 6px;
      }

      .business-nav span.active {
        background: #2f4966;
      }

      main {
        padding: 28px;
      }

      .toolbar,
      .form,
      .result-panel {
        background: white;
        border: 1px solid #d8e0ea;
        border-radius: 8px;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0;
        font-size: 24px;
      }

      button {
        min-height: 40px;
        border: 0;
        border-radius: 6px;
        padding: 0 16px;
        background: #1f6feb;
        color: white;
        font-weight: 700;
        cursor: pointer;
      }

      button.secondary {
        background: #475569;
      }

      .content-grid {
        display: grid;
        grid-template-columns: minmax(460px, 1fr) 260px;
        gap: 18px;
      }

      .form {
        padding: 22px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      label {
        display: grid;
        gap: 7px;
        color: #475569;
        font-size: 13px;
      }

      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        padding: 10px;
        font: inherit;
      }

      textarea {
        grid-column: 1 / -1;
        min-height: 100px;
      }

      .form-actions {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        margin-top: 20px;
      }

      .result-panel {
        padding: 20px;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 28px;
        padding: 0 10px;
        border-radius: 999px;
        background: #dcfce7;
        color: #166534;
        font-weight: 700;
      }

      .result-id {
        margin-top: 16px;
        padding: 12px;
        border-radius: 6px;
        background: #f8fafc;
        font-family: Consolas, monospace;
      }
    </style>
  </head>
  <body>
    <div class="business-shell">
      <aside class="business-nav">
        <strong>采购系统</strong>
        <span class="active">采购申请</span>
        <span>审批中心</span>
        <span>供应商管理</span>
        <span>统计报表</span>
      </aside>
      <main>
        <section class="toolbar">
          <div>
            <h1>采购申请</h1>
            <p>业务系统页面示例，可替换为真实系统地址。</p>
          </div>
          <button data-action="create">新建申请</button>
        </section>

        <section class="content-grid">
          <form class="form" data-action="fill">
            <div class="form-grid">
              <label>
                供应商
                <input data-action="supplier" data-label="供应商" value="上海示例供应商有限公司" />
              </label>
              <label>
                采购品类
                <select data-action="category" data-label="采购品类">
                  <option>办公设备</option>
                  <option>低值易耗</option>
                  <option>软件服务</option>
                </select>
              </label>
              <label>
                申请金额
                <input data-action="amount" data-label="申请金额" value="12800" />
              </label>
              <label>
                期望到货日期
                <input data-action="arrivalDate" data-label="期望到货日期" value="2026-07-18" />
              </label>
              <label>
                申请原因
                <textarea data-action="reason" data-label="申请原因">用于新员工入职设备补充。</textarea>
              </label>
            </div>
            <div class="form-actions">
              <button class="secondary" type="button" data-action="approve">审批通过</button>
              <button type="button" data-action="submit">提交申请</button>
            </div>
          </form>

          <aside class="result-panel" data-action="result">
            <span class="status-pill">待提交</span>
            <h2>业务单据</h2>
            <p>完成操作后，将此单号作为考试成果提交。</p>
            <div class="result-id">采购-2026-0001</div>
          </aside>
        </section>
      </main>
    </div>

    <script>
      function getActionType(actionElement, eventType) {
        if (actionElement.matches("input, textarea")) return "input";
        if (actionElement.matches("select")) return "select";
        if (actionElement.dataset.action === "submit") return "submit";
        if (eventType === "submit") return "submit";
        return "click";
      }

      function getActionText(actionElement, action) {
        return (
          actionElement.dataset.label ||
          actionElement.innerText ||
          actionElement.getAttribute("aria-label") ||
          action
        );
      }

      function getActionValue(actionElement) {
        if ("value" in actionElement) return actionElement.value;
        return undefined;
      }

      function sendAction(target, eventType) {
        const actionElement = target.closest("[data-action]");
        if (!actionElement) return;

        const rect = actionElement.getBoundingClientRect();
        const action = actionElement.dataset.action;
        const text = getActionText(actionElement, action);

        window.parent.postMessage(
          {
            type: "BUSINESS_ACTION",
            actionType: getActionType(actionElement, eventType),
            url: window.location.pathname,
            selector: `[data-action="${action}"]`,
            text: text.trim(),
            value: getActionValue(actionElement),
            rect: {
              x: Math.round(rect.x),
              y: Math.round(rect.y),
              width: Math.round(rect.width),
              height: Math.round(rect.height)
            },
            timestamp: new Date().toISOString()
          },
          "*"
        );
      }

      document.addEventListener("click", function (event) {
        sendAction(event.target, "click");
      });

      document.addEventListener("change", function (event) {
        sendAction(event.target, "change");
      });

      document.addEventListener(
        "blur",
        function (event) {
          sendAction(event.target, "blur");
        },
        true
      );

      document.querySelector(".form").addEventListener("submit", function (event) {
        event.preventDefault();
        sendAction(event.submitter || event.target, "submit");
      });

      function dispatchNativeEvent(element, eventName) {
        element.dispatchEvent(new Event(eventName, { bubbles: true }));
      }

      function playRecordedStep(step) {
        const target = document.querySelector(step.selector);
        if (!target) return;

        if (step.actionType === "input" || step.actionType === "select") {
          if ("value" in target && step.value !== undefined) {
            target.value = step.value;
          }
          dispatchNativeEvent(target, "input");
          dispatchNativeEvent(target, "change");
          return;
        }

        if (step.actionType === "click" || step.actionType === "submit") {
          target.click();
        }
      }

      window.addEventListener("message", function (event) {
        if (!event.data || event.data.type !== "PLAY_RECORDED_STEP") return;
        playRecordedStep(event.data.step);
      });
    </script>
  </body>
</html>
