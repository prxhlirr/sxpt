<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>教学编排悬浮操作轨原型</title>
    <style>
      :root {
        color: #172033;
        background: #edf1f6;
        font-family: Inter, "Microsoft YaHei", "PingFang SC", sans-serif;
        font-size: 16px;
        font-synthesis: none;
        --primary: #5b49d3;
        --primary-soft: #efecff;
        --line: #e1e6ee;
        --muted: #6c778a;
        --danger: #ca3c4f;
        --success: #16845f;
        --shadow: 0 22px 70px rgb(24 35 56 / 22%), 0 3px 12px rgb(24 35 56 / 9%);
      }

      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      button, input, textarea, select { font: inherit; }
      button { cursor: pointer; }

      .business-stage,
      .business-frame { position: fixed; inset: 0; width: 100vw; height: 100vh; }
      .business-stage { z-index: 0; background: #edf1f6; }
      .business-frame { display: block; border: 0; background: #edf1f6; }

      .prototype-label {
        position: fixed;
        z-index: 8;
        top: 14px;
        left: 50%;
        translate: -50% 0;
        border: 1px solid rgb(255 255 255 / 80%);
        border-radius: 999px;
        padding: 8px 14px;
        color: #526075;
        background: rgb(255 255 255 / 84%);
        box-shadow: 0 8px 28px rgb(24 35 56 / 13%);
        backdrop-filter: blur(14px);
        font-size: 16px;
        font-weight: 750;
        pointer-events: none;
      }

      body.is-picking .prototype-label { display: none; }

      .panel {
        position: fixed;
        z-index: 20;
        top: 14px;
        bottom: 14px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid rgb(255 255 255 / 86%);
        border-radius: 20px;
        background: rgb(252 253 255 / 97%);
        box-shadow: var(--shadow);
        backdrop-filter: blur(18px);
        transition: transform 220ms ease, opacity 180ms ease;
      }

      .directory-panel { left: 14px; width: 336px; }
      .property-panel { right: 14px; width: 400px; }
      .directory-panel.is-closed { transform: translateX(calc(-100% - 28px)); opacity: 0; pointer-events: none; }
      .property-panel.is-closed { transform: translateX(calc(100% + 28px)); opacity: 0; pointer-events: none; }

      .panel-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 1px solid var(--line);
        padding: 18px;
      }

      .eyebrow { display: block; margin-bottom: 5px; color: #8792a4; font-size: 16px; font-weight: 850; letter-spacing: .08em; }
      h1, h2, h3, p { margin: 0; }
      h1, h2 { font-size: 20px; line-height: 1.35; }
      h3 { font-size: 17px; }
      .meta { display: flex; gap: 8px; margin-top: 8px; color: var(--muted); font-size: 16px; }
      .saved { color: var(--success); font-weight: 800; }

      .icon-button {
        display: grid;
        flex: 0 0 auto;
        width: 42px;
        height: 42px;
        place-items: center;
        border: 1px solid #dce2eb;
        border-radius: 10px;
        color: #566176;
        background: #fff;
        font-size: 20px;
      }
      .icon-button:hover { border-color: #b9c2d0; color: #202b3d; }

      .selection-summary {
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr) auto;
        align-items: center;
        gap: 10px;
        border-bottom: 1px solid var(--line);
        padding: 12px 16px;
        background: #f8f9fc;
      }
      .selection-icon { display: grid; width: 40px; height: 40px; place-items: center; border-radius: 10px; color: var(--primary); background: var(--primary-soft); font-weight: 900; }
      .selection-copy { min-width: 0; }
      .selection-copy strong, .selection-copy small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .selection-copy strong { font-size: 16px; }
      .selection-copy small { margin-top: 3px; color: var(--muted); font-size: 16px; }
      .count { border-radius: 999px; padding: 4px 8px; color: #6f798a; background: #edf1f6; font-size: 16px; }

      .directory { min-height: 0; flex: 1; overflow: auto; padding: 12px; }
      .directory-heading { display: flex; justify-content: space-between; padding: 5px 6px 11px; color: #566277; font-size: 16px; font-weight: 800; }
      .directory-heading span:last-child { color: #929baa; font-weight: 600; }
      .point-card { margin-bottom: 8px; overflow: hidden; border: 1px solid transparent; border-radius: 12px; background: rgb(255 255 255 / 74%); }
      .point-card.is-selected { border-color: #cdc6ff; background: #f7f5ff; }

      .tree-button { display: grid; width: 100%; align-items: center; border: 0; color: #344054; background: transparent; text-align: left; }
      .point-button { grid-template-columns: 24px 34px minmax(0, 1fr) auto; gap: 9px; padding: 11px; }
      .drag { color: #a0a9b7; cursor: grab; font-size: 18px; letter-spacing: -5px; }
      .point-index { display: grid; width: 34px; height: 34px; place-items: center; border-radius: 9px; color: var(--primary); background: #eae7ff; font-size: 16px; font-weight: 900; }
      .tree-copy { min-width: 0; }
      .tree-copy strong, .tree-copy small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .tree-copy strong { font-size: 16px; }
      .tree-copy small { margin-top: 4px; color: #7f8999; font-size: 16px; }

      .node-list { position: relative; display: grid; gap: 4px; margin: 0 10px 10px 32px; padding-left: 14px; }
      .node-list::before { position: absolute; top: 0; bottom: 0; left: 0; width: 1px; background: #dcd7fa; content: ""; }
      .node-button { grid-template-columns: 20px 28px minmax(0, 1fr) 18px; gap: 8px; border-radius: 9px; padding: 9px; }
      .node-button:hover, .node-button.is-selected { color: #3e30a5; background: #ebe8ff; }
      .node-number { display: grid; width: 26px; height: 26px; place-items: center; border: 1px solid #d7dce7; border-radius: 50%; background: #fff; font-size: 16px; font-weight: 800; }
      .node-state { color: var(--success); font-size: 16px; }

      .directory-footer { border-top: 1px solid var(--line); padding: 12px 16px; color: #7b8697; background: #fff; font-size: 16px; line-height: 1.5; }

      .action-rail {
        position: fixed;
        z-index: 23;
        top: 50%;
        left: 364px;
        width: 132px;
        translate: 0 -50%;
        border: 1px solid rgb(255 255 255 / 86%);
        border-radius: 17px;
        padding: 8px;
        background: rgb(250 252 255 / 96%);
        box-shadow: 0 18px 50px rgb(24 35 56 / 20%), 0 3px 12px rgb(24 35 56 / 8%);
        backdrop-filter: blur(16px);
        transition: left 220ms ease, width 180ms ease, opacity 160ms ease;
      }

      body.directory-closed .action-rail { left: 14px; }
      body.is-picking .action-rail { opacity: 0; pointer-events: none; }
      .action-rail.is-compact { width: 58px; }

      .rail-head { display: flex; align-items: center; justify-content: space-between; gap: 4px; border-bottom: 1px solid var(--line); padding: 3px 3px 8px; }
      .rail-head strong { overflow: hidden; color: #707b8e; font-size: 16px; white-space: nowrap; }
      .rail-collapse { display: grid; width: 30px; height: 30px; place-items: center; border: 0; border-radius: 8px; color: #748094; background: #edf1f6; font-size: 16px; }
      .action-rail.is-compact .rail-head strong { display: none; }
      .action-rail.is-compact .rail-collapse { margin: auto; rotate: 180deg; }

      .rail-actions { display: grid; gap: 6px; padding-top: 8px; }
      .rail-divider { height: 1px; margin: 3px 4px; background: var(--line); }
      .rail-button {
        position: relative;
        display: grid;
        width: 100%;
        min-height: 48px;
        grid-template-columns: 30px minmax(0, 1fr);
        align-items: center;
        gap: 6px;
        border: 1px solid transparent;
        border-radius: 11px;
        padding: 7px 8px;
        color: #4d596c;
        background: transparent;
        font-size: 16px;
        font-weight: 760;
        text-align: left;
      }
      .rail-button:hover { border-color: #dce2eb; background: #fff; }
      .rail-button.primary { color: #fff; background: var(--primary); box-shadow: 0 7px 18px rgb(91 73 211 / 23%); }
      .rail-button.publish { color: #4f3ebd; background: var(--primary-soft); }
      .rail-button:disabled { cursor: not-allowed; opacity: .4; }
      .rail-icon { display: grid; width: 30px; height: 30px; place-items: center; border-radius: 8px; color: inherit; background: rgb(255 255 255 / 66%); font-size: 18px; font-weight: 900; }
      .rail-button.primary .rail-icon { background: rgb(255 255 255 / 16%); }
      .rail-label { overflow: hidden; white-space: nowrap; }
      .action-rail.is-compact .rail-button { grid-template-columns: 30px; justify-content: center; padding: 7px 5px; }
      .action-rail.is-compact .rail-label { display: none; }

      .action-rail.is-compact .rail-button:hover::after {
        position: absolute;
        top: 50%;
        left: calc(100% + 10px);
        min-width: max-content;
        border-radius: 8px;
        padding: 7px 10px;
        color: #fff;
        background: rgb(31 42 58 / 92%);
        box-shadow: 0 6px 18px rgb(17 25 39 / 18%);
        content: attr(data-label);
        translate: 0 -50%;
        font-size: 16px;
        font-weight: 700;
      }

      .more-popover {
        position: fixed;
        z-index: 24;
        top: 50%;
        left: 506px;
        display: none;
        width: 250px;
        border: 1px solid rgb(255 255 255 / 88%);
        border-radius: 15px;
        padding: 10px;
        background: rgb(252 253 255 / 98%);
        box-shadow: var(--shadow);
        translate: 0 85px;
        backdrop-filter: blur(16px);
      }
      .more-popover.is-open { display: grid; gap: 7px; }
      body.directory-closed .more-popover { left: 156px; }
      body.rail-compact .more-popover { left: 432px; }
      body.directory-closed.rail-compact .more-popover { left: 82px; }
      .more-title { display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); padding: 5px 6px 9px; color: #566277; font-size: 16px; font-weight: 850; }
      .more-title span:last-child { color: #929baa; font-weight: 600; }
      .more-button { min-height: 42px; border: 0; border-radius: 9px; padding: 8px 10px; color: #4f5b6e; background: #f5f7fa; font-size: 16px; font-weight: 720; text-align: left; }
      .more-button:hover { background: #eceff5; }
      .more-button.danger { color: var(--danger); background: #fff3f5; }

      .property-scroll { min-height: 0; flex: 1; overflow: auto; padding: 18px; }
      .property-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
      .property-heading p { margin-top: 7px; color: var(--muted); font-size: 16px; line-height: 1.55; }
      .type-badge { flex: 0 0 auto; border-radius: 999px; padding: 6px 9px; color: var(--primary); background: var(--primary-soft); font-size: 16px; font-weight: 800; }
      .form-section { display: grid; gap: 12px; margin-top: 18px; border-top: 1px solid var(--line); padding-top: 18px; }
      .form-title { color: #4d596c; font-size: 16px; font-weight: 850; }
      .field { display: grid; gap: 7px; }
      .field span { color: #596579; font-size: 16px; font-weight: 750; }
      .field input, .field textarea, .field select { width: 100%; min-height: 44px; border: 1px solid #dce2eb; border-radius: 10px; outline: 0; padding: 10px 12px; color: #253145; background: #fff; font-size: 16px; }
      .field textarea { min-height: 96px; resize: vertical; }
      .field input:focus, .field textarea:focus, .field select:focus { border-color: #7869df; box-shadow: 0 0 0 3px rgb(120 105 223 / 12%); }
      .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .binding { display: grid; grid-template-columns: 40px minmax(0, 1fr); align-items: center; gap: 10px; border: 1px solid #d8d2ff; border-radius: 12px; padding: 11px; color: #5144ad; background: #f5f3ff; }
      .binding-icon { display: grid; width: 38px; height: 38px; place-items: center; border-radius: 9px; background: #e7e2ff; }
      .binding strong, .binding small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .binding strong { font-size: 16px; }
      .binding small { margin-top: 3px; color: #8075bf; font-size: 16px; }
      .attachment { border: 1px dashed #cbd3df; border-radius: 12px; padding: 12px; color: #657186; background: #f8fafc; font-size: 16px; line-height: 1.5; }
      .property-footer { display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid var(--line); padding: 12px 18px; background: #fff; }
      .normal-button { min-height: 42px; border: 1px solid #dce2eb; border-radius: 10px; padding: 8px 14px; color: #4d596c; background: #fff; font-size: 16px; font-weight: 750; }
      .normal-button.primary { border-color: var(--primary); color: #fff; background: var(--primary); }

      .edge-trigger { position: fixed; z-index: 18; top: 50%; display: grid; width: 38px; min-height: 92px; place-items: center; border: 1px solid rgb(255 255 255 / 72%); color: #fff; background: rgb(34 45 64 / 75%); box-shadow: 0 8px 24px rgb(24 35 56 / 18%); backdrop-filter: blur(12px); font-size: 16px; font-weight: 850; opacity: .5; }
      .edge-trigger:hover { opacity: 1; }
      .edge-trigger.left { left: 0; border-left: 0; border-radius: 0 11px 11px 0; }
      .edge-trigger.right { right: 0; border-right: 0; border-radius: 11px 0 0 11px; }
      .edge-trigger span { writing-mode: vertical-rl; letter-spacing: .12em; }
      body.is-picking .edge-trigger { display: none; }

      .picking-bar { position: fixed; z-index: 28; top: 14px; left: 50%; display: none; align-items: center; gap: 12px; border: 1px solid rgb(255 255 255 / 68%); border-radius: 999px; padding: 8px 9px 8px 14px; color: #fff; background: rgb(31 41 58 / 86%); box-shadow: 0 10px 32px rgb(18 27 42 / 23%); backdrop-filter: blur(14px); translate: -50% 0; font-size: 16px; }
      body.is-picking .picking-bar { display: flex; }
      .picking-dot { width: 9px; height: 9px; border-radius: 50%; background: #ff5467; box-shadow: 0 0 0 5px rgb(255 84 103 / 17%); animation: pulse 1.2s infinite; }
      .picking-bar span { color: #cbd3dd; }
      .picking-bar button { min-height: 36px; border: 0; border-radius: 999px; padding: 7px 12px; color: #fff; background: #d83e51; font-size: 16px; font-weight: 800; }

      .toast { position: fixed; z-index: 30; bottom: 20px; left: 50%; max-width: min(640px, calc(100vw - 40px)); border: 1px solid rgb(255 255 255 / 72%); border-radius: 12px; padding: 11px 16px; color: #fff; background: rgb(31 42 58 / 88%); box-shadow: 0 9px 28px rgb(17 25 39 / 20%); backdrop-filter: blur(12px); translate: -50% 16px; font-size: 16px; opacity: 0; pointer-events: none; transition: opacity 160ms ease, translate 160ms ease; }
      .toast.is-visible { translate: -50% 0; opacity: 1; }
      @keyframes pulse { 50% { opacity: .4; } }

      @media (max-width: 1020px) {
        .directory-panel { width: min(336px, calc(100vw - 54px)); }
        .property-panel { width: min(400px, calc(100vw - 54px)); }
        .action-rail { left: 14px; }
        .directory-panel:not(.is-closed) + .action-rail { left: 364px; }
      }
    </style>
  </head>
  <body>
    <main class="business-stage" aria-label="全屏业务系统">
      <iframe id="businessFrame" class="business-frame" src="./lesson-business-capture.html" title="业务系统"></iframe>
    </main>
    <div class="prototype-label">悬浮操作轨原型 · 无顶部及底部工具栏</div>

    <aside id="directoryPanel" class="panel directory-panel" aria-label="教学目录">
      <header class="panel-header">
        <div><span class="eyebrow">LESSON AUTHORING</span><h1>测试教案 01</h1><div class="meta"><span>V1</span><span>·</span><span id="saveState" class="saved">已保存</span></div></div>
        <button class="icon-button" type="button" data-close="directory" title="收起目录">‹</button>
      </header>
      <section class="selection-summary">
        <span id="selectionIcon" class="selection-icon">点</span>
        <span class="selection-copy"><strong id="selectionTitle">申请与录入</strong><small id="selectionType">当前选择：教学点</small></span>
        <span id="selectionCount" class="count">2 节点</span>
      </section>
      <section class="directory">
        <div class="directory-heading"><span>教学目录</span><span>拖动调整顺序</span></div>
        <article class="point-card is-selected" data-point="apply">
          <button class="tree-button point-button" type="button" data-select-point="apply"><span class="drag">⠿</span><span class="point-index">01</span><span class="tree-copy"><strong>申请与录入</strong><small>填写采购申请基本信息</small></span><span class="count">2</span></button>
          <div class="node-list">
            <button class="tree-button node-button" type="button" data-select-node="create"><span class="drag">⠿</span><span class="node-number">1</span><span class="tree-copy"><strong>新建采购申请</strong><small>点击操作</small></span><span class="node-state">✓</span></button>
            <button class="tree-button node-button" type="button" data-select-node="subject"><span class="drag">⠿</span><span class="node-number">2</span><span class="tree-copy"><strong>填写申请主题</strong><small>表单录入</small></span><span class="node-state">✓</span></button>
          </div>
        </article>
        <article class="point-card" data-point="approve">
          <button class="tree-button point-button" type="button" data-select-point="approve"><span class="drag">⠿</span><span class="point-index">02</span><span class="tree-copy"><strong>审批与确认</strong><small>完成部门审批与结果确认</small></span><span class="count">2</span></button>
          <div class="node-list">
            <button class="tree-button node-button" type="button" data-select-node="submit"><span class="drag">⠿</span><span class="node-number">1</span><span class="tree-copy"><strong>提交审批</strong><small>点击操作</small></span><span class="node-state">✓</span></button>
            <button class="tree-button node-button" type="button" data-select-node="confirm"><span class="drag">⠿</span><span class="node-number">2</span><span class="tree-copy"><strong>确认审批结果</strong><small>状态判断</small></span><span class="node-state">✓</span></button>
          </div>
        </article>
        <article class="point-card" data-point="archive">
          <button class="tree-button point-button" type="button" data-select-point="archive"><span class="drag">⠿</span><span class="point-index">03</span><span class="tree-copy"><strong>归档与查看</strong><small>查看业务单据并完成归档</small></span><span class="count">1</span></button>
          <div class="node-list">
            <button class="tree-button node-button" type="button" data-select-node="archive-node"><span class="drag">⠿</span><span class="node-number">1</span><span class="tree-copy"><strong>归档采购单</strong><small>点击操作</small></span><span class="node-state">✓</span></button>
          </div>
        </article>
      </section>
      <footer class="directory-footer">目录只负责选择和排序，所有操作按钮已移至右侧悬浮操作轨。</footer>
    </aside>

    <nav id="actionRail" class="action-rail" aria-label="编排操作轨">
      <div class="rail-head"><strong id="railTitle">教学点操作</strong><button id="collapseRail" class="rail-collapse" type="button" title="缩为图标">‹</button></div>
      <div class="rail-actions">
        <button id="contextAction" class="rail-button primary" type="button" data-label="选取元素"><span class="rail-icon">⌖</span><span class="rail-label">选取元素</span></button>
        <button id="addPoint" class="rail-button" type="button" data-label="加教学点"><span class="rail-icon">＋</span><span class="rail-label">加教学点</span></button>
        <button id="rebindNode" class="rail-button" type="button" data-label="重新绑定" disabled><span class="rail-icon">↻</span><span class="rail-label">重新绑定</span></button>
        <div class="rail-divider"></div>
        <button class="rail-button" type="button" data-action="save" data-label="保存"><span class="rail-icon">✓</span><span class="rail-label">保存</span></button>
        <button class="rail-button" type="button" data-action="preview" data-label="预览"><span class="rail-icon">▷</span><span class="rail-label">预览</span></button>
        <button class="rail-button publish" type="button" data-action="publish" data-label="发布"><span class="rail-icon">↑</span><span class="rail-label">发布</span></button>
        <button id="moreButton" class="rail-button" type="button" data-label="更多"><span class="rail-icon">•••</span><span class="rail-label">更多</span></button>
      </div>
    </nav>

    <section id="morePopover" class="more-popover" aria-label="更多操作">
      <div class="more-title"><span id="moreTitle">教学点更多操作</span><span>低频操作</span></div>
      <button class="more-button" type="button" data-more="lesson">教案基础设置</button>
      <button class="more-button" type="button" data-more="duplicate">复制当前教学点</button>
      <button class="more-button danger" type="button" data-more="delete">删除当前教学点</button>
    </section>

    <aside id="propertyPanel" class="panel property-panel is-closed" aria-label="属性配置">
      <header class="panel-header"><div><span class="eyebrow">PROPERTY INSPECTOR</span><h2 id="propertyTitle">教学点配置</h2></div><button class="icon-button" type="button" data-close="property">›</button></header>
      <div id="propertyContent" class="property-scroll"></div>
      <footer class="property-footer"><button class="normal-button" type="button" data-close="property">取消</button><button class="normal-button primary" type="button" data-action="save">保存属性</button></footer>
    </aside>

    <button id="directoryTrigger" class="edge-trigger left" type="button"><span>教学目录</span></button>
    <button id="propertyTrigger" class="edge-trigger right" type="button"><span>属性配置</span></button>
    <div class="picking-bar"><span class="picking-dot"></span><strong>正在选取页面元素</strong><span>选中后自动打开节点属性</span><button id="cancelPicking" type="button">结束选取</button></div>
    <div id="toast" class="toast" role="status"></div>

    <script>
      const points = {
        apply: { name: "申请与录入", description: "填写采购申请基本信息，并讲解录入规范。", score: 35, role: "申请人", count: 2 },
        approve: { name: "审批与确认", description: "完成部门审批，并判断审批结果。", score: 40, role: "部门负责人", count: 2 },
        archive: { name: "归档与查看", description: "查看完整采购单并完成归档。", score: 25, role: "采购专员", count: 1 }
      };
      const nodes = {
        create: { name: "新建采购申请", point: "apply", type: "点击", selector: "button[data-action='create']", description: "点击新建按钮，进入采购申请表单。" },
        subject: { name: "填写申请主题", point: "apply", type: "输入", selector: "input[name='subject']", description: "填写能够清楚说明采购用途的申请主题。" },
        submit: { name: "提交审批", point: "approve", type: "点击", selector: "button[data-action='submit']", description: "检查信息无误后提交审批。" },
        confirm: { name: "确认审批结果", point: "approve", type: "状态判断", selector: ".approval-status", description: "确认审批状态已经变更为通过。" },
        "archive-node": { name: "归档采购单", point: "archive", type: "点击", selector: "button[data-action='archive']", description: "点击归档并检查列表状态。" }
      };

      const directoryPanel = document.querySelector("#directoryPanel");
      const propertyPanel = document.querySelector("#propertyPanel");
      const actionRail = document.querySelector("#actionRail");
      const morePopover = document.querySelector("#morePopover");
      const businessFrame = document.querySelector("#businessFrame");
      const propertyContent = document.querySelector("#propertyContent");
      const toast = document.querySelector("#toast");
      let activePoint = "apply";
      let activeNode = "";
      let toastTimer;

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("is-visible");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("is-visible"), 2300);
      }

      function setDirectory(open) {
        directoryPanel.classList.toggle("is-closed", !open);
        document.body.classList.toggle("directory-closed", !open);
      }

      function setProperty(open) { propertyPanel.classList.toggle("is-closed", !open); }

      function markSaved() {
        const state = document.querySelector("#saveState");
        state.textContent = "保存中…";
        state.classList.remove("saved");
        setTimeout(() => { state.textContent = "已保存"; state.classList.add("saved"); }, 600);
      }

      function updateSelection() {
        const point = points[activePoint];
        const node = activeNode ? nodes[activeNode] : null;
        document.querySelector("#selectionIcon").textContent = node ? "节" : "点";
        document.querySelector("#selectionTitle").textContent = node?.name ?? point.name;
        document.querySelector("#selectionType").textContent = node ? `所属教学点：${point.name}` : "当前选择：教学点";
        document.querySelector("#selectionCount").textContent = node ? node.type : `${point.count} 节点`;
        document.querySelector("#railTitle").textContent = node ? "节点操作" : "教学点操作";
        document.querySelector("#contextAction .rail-label").textContent = node ? "加下一节点" : "选取元素";
        document.querySelector("#contextAction").dataset.label = node ? "加下一节点" : "选取元素";
        document.querySelector("#rebindNode").disabled = !node;
        document.querySelector("#moreTitle").textContent = node ? "节点更多操作" : "教学点更多操作";
        const moreButtons = morePopover.querySelectorAll("[data-more]");
        moreButtons[1].textContent = node ? "复制当前节点" : "复制当前教学点";
        moreButtons[2].textContent = node ? "删除当前节点" : "删除当前教学点";
      }

      function wireInputs() { propertyContent.querySelectorAll("input, textarea, select").forEach((element) => element.addEventListener("input", markSaved)); }

      function renderPointProperty() {
        const point = points[activePoint];
        document.querySelector("#propertyTitle").textContent = "教学点配置";
        propertyContent.innerHTML = `
          <div class="property-heading"><div><span class="eyebrow">TEACHING POINT</span><h2>${point.name}</h2><p>右侧只配置当前教学点的属性，操作按钮始终位于独立操作轨。</p></div><span class="type-badge">教学点</span></div>
          <section class="form-section"><strong class="form-title">基本信息</strong><label class="field"><span>教学点名称</span><input value="${point.name}" /></label><label class="field"><span>阶段说明</span><textarea>${point.description}</textarea></label><div class="field-row"><label class="field"><span>客观分值</span><input type="number" value="${point.score}" /></label><label class="field"><span>业务角色</span><input value="${point.role}" /></label></div></section>
          <section class="form-section"><strong class="form-title">附件资料</strong><div class="attachment">拖入或点击上传教学点讲解资料、制度文件和示例附件。</div></section>`;
        wireInputs();
      }

      function renderNodeProperty() {
        const node = nodes[activeNode];
        document.querySelector("#propertyTitle").textContent = "节点配置";
        propertyContent.innerHTML = `
          <div class="property-heading"><div><span class="eyebrow">RECORDED NODE</span><h2>${node.name}</h2><p>节点操作已自动切换到左侧悬浮操作轨。</p></div><span class="type-badge">${node.type}</span></div>
          <section class="form-section"><strong class="form-title">讲解内容</strong><label class="field"><span>节点名称</span><input value="${node.name}" /></label><label class="field"><span>本节点说明</span><textarea>${node.description}</textarea></label></section>
          <section class="form-section"><strong class="form-title">元素与完成判定</strong><div class="binding"><span class="binding-icon">⌖</span><span><strong>已绑定页面元素</strong><small>${node.selector}</small></span></div><div class="field-row"><label class="field"><span>操作类型</span><select><option>${node.type}</option><option>点击</option><option>输入</option></select></label><label class="field"><span>完成方式</span><select><option>操作即完成</option><option>状态判断</option></select></label></div></section>
          <section class="form-section"><strong class="form-title">附件资料</strong><div class="attachment">可上传与当前节点相关的截图、规范或示例文件。</div></section>`;
        wireInputs();
      }

      function selectPoint(id) {
        activePoint = id; activeNode = "";
        document.querySelectorAll(".point-card").forEach((card) => card.classList.toggle("is-selected", card.dataset.point === id));
        document.querySelectorAll(".node-button").forEach((button) => button.classList.remove("is-selected"));
        updateSelection(); renderPointProperty(); setProperty(true); morePopover.classList.remove("is-open");
      }

      function selectNode(id) {
        activeNode = id; activePoint = nodes[id].point;
        document.querySelectorAll(".point-card").forEach((card) => card.classList.toggle("is-selected", card.dataset.point === activePoint));
        document.querySelectorAll(".node-button").forEach((button) => button.classList.toggle("is-selected", button.dataset.selectNode === id));
        updateSelection(); renderNodeProperty(); setProperty(true); morePopover.classList.remove("is-open");
        businessFrame.contentWindow?.postMessage({ type: "SXPT_PREVIEW_STEP", selector: nodes[id].selector }, "*");
      }

      function startPicking() {
        document.body.classList.add("is-picking");
        setDirectory(false); setProperty(false); morePopover.classList.remove("is-open");
        businessFrame.contentWindow?.postMessage({ type: "SXPT_SET_RECORDING", enabled: true }, "*");
        businessFrame.contentWindow?.postMessage({ type: "SXPT_START_ELEMENT_PICK" }, "*");
        showToast("请选择业务界面元素，选中后再配置节点属性");
      }

      function stopPicking() {
        document.body.classList.remove("is-picking");
        businessFrame.contentWindow?.postMessage({ type: "SXPT_CANCEL_ELEMENT_PICK" }, "*");
        businessFrame.contentWindow?.postMessage({ type: "SXPT_SET_RECORDING", enabled: false }, "*");
        setDirectory(true);
      }

      document.querySelectorAll("[data-close]").forEach((button) => button.addEventListener("click", () => button.dataset.close === "directory" ? setDirectory(false) : setProperty(false)));
      document.querySelector("#directoryTrigger").addEventListener("click", () => setDirectory(true));
      document.querySelector("#propertyTrigger").addEventListener("click", () => setProperty(true));
      document.querySelector("#collapseRail").addEventListener("click", () => { const compact = actionRail.classList.toggle("is-compact"); document.body.classList.toggle("rail-compact", compact); morePopover.classList.remove("is-open"); });
      document.querySelector("#moreButton").addEventListener("click", () => morePopover.classList.toggle("is-open"));
      document.querySelector("#contextAction").addEventListener("click", startPicking);
      document.querySelector("#addPoint").addEventListener("click", () => { activeNode = ""; updateSelection(); renderPointProperty(); setProperty(true); showToast("已打开新教学点属性配置"); });
      document.querySelector("#rebindNode").addEventListener("click", startPicking);
      document.querySelector("#cancelPicking").addEventListener("click", stopPicking);
      document.querySelectorAll("[data-select-point]").forEach((button) => button.addEventListener("click", () => selectPoint(button.dataset.selectPoint)));
      document.querySelectorAll("[data-select-node]").forEach((button) => button.addEventListener("click", (event) => { event.stopPropagation(); selectNode(button.dataset.selectNode); }));
      document.querySelectorAll("[data-action]").forEach((button) => button.addEventListener("click", () => { if (button.dataset.action === "save") { markSaved(); showToast("编排内容已保存"); } else if (button.dataset.action === "preview") showToast("原型演示：进入教师讲解预览"); else if (button.dataset.action === "publish") showToast("校验通过，原型演示：教案发布成功"); }));
      document.querySelectorAll("[data-more]").forEach((button) => button.addEventListener("click", () => { const objectName = activeNode ? nodes[activeNode].name : points[activePoint].name; if (button.dataset.more === "lesson") showToast("原型演示：打开教案基础设置"); else if (button.dataset.more === "duplicate") showToast(`原型演示：已复制“${objectName}”`); else showToast(`原型演示：确认后删除“${objectName}”`); morePopover.classList.remove("is-open"); }));

      window.addEventListener("message", (event) => {
        if (event.source !== businessFrame.contentWindow || !event.data || typeof event.data !== "object") return;
        if (["SXPT_ELEMENT_PICK_CANCELLED", "ELEMENT_PICK_CANCELLED"].includes(event.data.type)) return stopPicking();
        if (!["SXPT_ELEMENT_PICKED", "ELEMENT_PICKED"].includes(event.data.type)) return;
        const payload = event.data.payload ?? event.data;
        const id = `picked-${Date.now()}`;
        nodes[id] = { name: String(payload.text || payload.actionLabel || "新录制节点").trim(), point: activePoint, type: payload.actionType || "点击", selector: payload.selector || "已绑定页面元素", description: "请补充本节点的讲解说明。" };
        activeNode = id;
        document.body.classList.remove("is-picking");
        businessFrame.contentWindow?.postMessage({ type: "SXPT_SET_RECORDING", enabled: false }, "*");
        setDirectory(true); updateSelection(); renderNodeProperty(); setProperty(true); showToast("元素选取完成，已切换为节点操作");
      });
      document.addEventListener("keydown", (event) => { if (event.key === "Escape" && document.body.classList.contains("is-picking")) stopPicking(); });

      updateSelection(); renderPointProperty();
      setTimeout(() => showToast("新版原型：常用按钮已移至独立悬浮操作轨"), 500);
    </script>
  </body>
</html>
