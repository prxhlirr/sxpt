server:
  port: "${SXPT_SERVER_PORT:8080}"
  servlet:
    context-path: /

spring:
  application:
    name: sxpt_api
  profiles:
    # The development profile exposes /api/v1/auth/token for the simulated
    # frontend identity. Override this with SPRING_PROFILES_ACTIVE in deployment.
    active: "${SPRING_PROFILES_ACTIVE:dev}"
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver
    url: "${SXPT_DB_URL:jdbc:postgresql://127.0.0.1:55433/sxpt_dev?stringtype=unspecified}"
    username: "${SXPT_DB_USERNAME:postgres}"
    password: "${SXPT_DB_PASSWORD:liyz}"
    druid:
      initial-size: 1
      min-idle: 1
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
  redis:
    host: "${SXPT_REDIS_HOST:127.0.0.1}"
    port: "${SXPT_REDIS_PORT:6379}"
    password: "${SXPT_REDIS_PASSWORD:}"
    timeout: 3000
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

jwt:
  # Development-only fallback. Production must provide SXPT_JWT_SECRET.
  secret: "${SXPT_JWT_SECRET:sxpt_dev_jwt_secret}"
  expire-seconds: "${SXPT_JWT_EXPIRE_SECONDS:7200}"

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.sxpt.module.*.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: info
    com.sxpt: info

sxpt:
  cors:
    allowed-origins: "${SXPT_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175}"
  demo-identity:
    # Formal authentication is connected. Demo identities must be enabled
    # explicitly when a developer needs the legacy simulated-login environment.
    enabled: "${SXPT_DEMO_IDENTITY_ENABLED:false}"
  attachments:
    storage-root: "${SXPT_ATTACHMENT_STORAGE_ROOT:./data/teaching-attachments}"
    max-file-bytes: "${SXPT_ATTACHMENT_MAX_FILE_BYTES:5242880}"
    url-token-secret: "${SXPT_ATTACHMENT_TOKEN_SECRET:sxpt_dev_attachment_url_secret}"
  origin:
    # local: 使用本地联调 Adapter；http: 按 platform_capability.endpoint_url 调用真实原平台。
    adapter-mode: "${SXPT_ORIGIN_ADAPTER_MODE:http}"
    local-adapter:
      enabled: "${SXPT_ORIGIN_LOCAL_ADAPTER_ENABLED:false}"

---
spring:
  profiles: dev
  datasource:
    # 历史脚本由人工执行，尚未接入 Flyway。dev 启动时只执行本次经典案例接入所需的
    # 幂等结构升级和本地 OA 环境配对，避免 Java 实体与数据库表结构版本不一致。
    initialization-mode: always
    continue-on-error: false
    schema:
      - classpath:db/schema/V18__classic_case_connector_contract.sql
      - classpath:db/dev/classic_case_oa_local_bootstrap.sql
